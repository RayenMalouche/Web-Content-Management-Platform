<!-- The parts tray: every part the backend offers, on one sprue, ready to drag out. -->
<div class="tray">
  <h2 class="tray__title">Parts tray</h2>
  <p class="tray__hint">Drag a part onto the mat. Rows and columns take more parts inside them.</p>

  <ul class="tray__sprue" *ngIf="originList.length; else emptyTray">
    <li *ngFor="let node of originList; let i = index"
        class="tray__part"
        draggable="true"
        [dndDraggable]="node"
        (dndCanceled)="onDragged($event, node, 'none')"
        (dndCopied)="onDragged($event, node, 'copy')"
        (dndEnd)="onDragEnd($event)"
        (dndLinked)="onDragged($event, node, 'link')"
        (dndMoved)="onDragged($event, node, 'move')"
        (dndStart)="onDragStart($event)"
        dndEffectAllowed="move">
      <span class="tray__no">A{{ i + 1 }}</span>
      <i [ngClass]="getIconClass(node.type)" aria-hidden="true"></i>
      <span class="tray__name">{{ node.name }}</span>
      <span class="tray__type">{{ node.type }}</span>
    </li>
  </ul>

  <ng-template #emptyTray>
    <p class="kit-empty">The tray is empty, the server hasn't sent any parts yet.</p>
  </ng-template>
</div>
