<!-- The assembly: every node is a part on the mat; rows and columns hold more parts. -->
<ng-template #recursiveList let-list>
  <div class="drop-slot" dndPlaceholderRef aria-hidden="true">Drop here</div>

  <div class="asm-part"
       *ngFor="let node of list"
       [ngClass]="{ 'is-selected': node?.selected, 'is-widget': node?.type === 'widget' }"
       [dndDraggable]="node"
       (dndCanceled)="onDragged($event, node, list, 'none')"
       (dndCopied)="onDragged($event, node, list, 'copy')"
       (dndEnd)="onDragEnd($event)"
       (dndLinked)="onDragged($event, node, list, 'link')"
       (dndMoved)="onDragged($event, node, list, 'move')"
       (dndStart)="onDragStart($event)"
       (click)="onClickNode($event, node, false, list)"
       dndEffectAllowed="move"
       [style.background-color]="node?.backgroundColor"
       [style.border-color]="node?.borderColor"
       [style.width]="node?.width ? node?.width + 'px' : null"
       [style.height]="node?.height ? node?.height + 'px' : null">
    <div class="asm-part__head">
      <span class="asm-part__type" [title]="node?.type">{{ node?.type | firstChar }}</span>
      <span class="asm-part__name">{{ node?.name }}</span>
      <button type="button" class="asm-part__remove" (click)="onRemove(node, list)" [attr.aria-label]="'Remove ' + node?.name">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <div *ngIf="node?.type === 'row'" dndDropzone class="asm-zone asm-zone--row"
         (dndDrop)="onDrop($event, node?.children ?? [])">
      <ng-container *ngTemplateOutlet="recursiveList; context: { $implicit: node?.children ?? [] }"></ng-container>
    </div>
    <div *ngIf="node?.type === 'column'" dndDropzone class="asm-zone asm-zone--column"
         (dndDrop)="onDrop($event, node?.children ?? [])">
      <ng-container *ngTemplateOutlet="recursiveList; context: { $implicit: node?.children ?? [] }"></ng-container>
    </div>
  </div>
</ng-template>

<div dndDropzone class="asm-root" [ngClass]="{ 'is-selected': root?.selected, 'is-empty': !root?.children?.length }"
     (click)="onClickNode($event, root!, true)" (dndDrop)="onDrop($event, root?.children ?? [])"
     [style.background-color]="root?.backgroundColor"
     [style.border-color]="root?.borderColor"
     [style.width]="root?.width ? root?.width + 'px' : null"
     [style.height]="root?.height ? root?.height + 'px' : null">
  <span class="asm-root__label">Page · {{ root?.name || 'untitled' }}</span>
  <ng-container *ngTemplateOutlet="recursiveList; context: { $implicit: root?.children ?? [] }"></ng-container>
  <p class="asm-root__empty" *ngIf="!root?.children?.length">Drag the first part here from the tray.</p>
</div>
