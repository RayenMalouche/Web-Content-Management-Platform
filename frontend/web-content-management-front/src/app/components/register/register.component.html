<div class="entry">
  <aside class="entry__lid">
    <a routerLink="/" class="entry__brand">Web App Builder</a>
    <app-exploded-view tone="dark" class="entry__art"></app-exploded-view>
    <p class="entry__note">Kit Nº 01 · every builder gets their own box.</p>
  </aside>

  <main class="entry__form">
    <span class="kit-eyebrow">Step 0 · register the builder</span>
    <h1>Create an account</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="kit-field">
        <label for="name">Full name</label>
        <input type="text" id="name" formControlName="name" placeholder="Jane Builder" autocomplete="name" required>
        <span class="kit-error" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">Name is required.</span>
      </div>

      <div class="kit-field">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="kit-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <ng-container *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</ng-container>
          <ng-container *ngIf="registerForm.get('email')?.errors?.['email']">That isn't a valid email.</ng-container>
        </span>
      </div>

      <div class="kit-field">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="6+ characters" autocomplete="new-password" required>
        <span class="kit-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <ng-container *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</ng-container>
          <ng-container *ngIf="registerForm.get('password')?.errors?.['minlength']">At least 6 characters.</ng-container>
        </span>
      </div>

      <div class="entry__row">
        <div class="kit-field">
          <label for="role">Role</label>
          <select id="role" formControlName="role" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="manager">Manager</option>
          </select>
        </div>

        <div class="kit-field">
          <label for="responsable">Manager (optional)</label>
          <select id="responsable" formControlName="responsableId">
            <option value="">None</option>
            <option *ngFor="let user of availableUsers" [value]="user.id">{{ user.name }} ({{ user.email }})</option>
          </select>
        </div>
      </div>

      <p *ngIf="errorMessage" class="kit-alert" role="alert">{{ errorMessage }}</p>

      <button type="submit" class="kit-btn kit-btn--primary kit-btn--block entry__submit" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="entry__alt">Already have an account? <a routerLink="/login">Log in</a></p>
  </main>
</div>
