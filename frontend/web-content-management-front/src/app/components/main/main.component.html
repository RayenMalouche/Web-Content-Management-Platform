<!-- The workbench: parts tray, assembly area on the cutting mat, paint guide. -->
<div class="bench" [class.is-preview]="isPreviewMode">
  <header class="bench__bar">
    <a routerLink="/dashboard" class="bench__brand" title="Back to the dashboard">
      <span class="bench__mark" aria-hidden="true">01</span>
      <span>Web App Builder</span>
    </a>
    <span class="bench__mode">{{ isPreviewMode ? 'Preview' : 'Assembly' }}</span>
    <div class="bench__actions">
      <button type="button" class="kit-btn kit-btn--sm bench__btn" (click)="togglePreview()" [attr.aria-pressed]="isPreviewMode">
        <i class="fas" [ngClass]="isPreviewMode ? 'fa-pen' : 'fa-eye'" aria-hidden="true"></i>
        {{ isPreviewMode ? 'Back to assembly' : 'Preview' }}
      </button>
      <button type="button" class="kit-btn kit-btn--sm kit-btn--danger bench__btn" (click)="clearAll()">
        <i class="fas fa-trash-alt" aria-hidden="true"></i> Clear
      </button>
      <button type="button" class="kit-btn kit-btn--sm kit-btn--primary" (click)="save()">
        <i class="fas fa-save" aria-hidden="true"></i> Save
      </button>
    </div>
  </header>

  <div class="bench__body">
    <aside class="bench__tray" aria-label="Parts tray" *ngIf="!isPreviewMode">
      <app-origin-list (dragStart)="onDragStart()" (dragMove)="onDragged($event)" (dragEnd)="onDragEnd()"></app-origin-list>
    </aside>

    <main class="bench__mat">
      <app-cutting-mat [size]="28" [numSquares]="14"></app-cutting-mat>
      <div class="bench__canvas">
        <app-layout [root]="root" (drop)="onDrop($event)" (dragStart)="onDragStart()"
                    (dragMove)="onDragged($event)" (dragEnd)="onDragEnd()"
                    (remove)="onRemove($event)" (nodeSelected)="onNodeSelected($event)"></app-layout>
      </div>
    </main>

    <aside class="bench__guide" aria-label="Paint guide" *ngIf="!isPreviewMode">
      <app-options [root]="root" [selectedNode$]="selectedNode$" [selectedNodeIsRoot]="isLastSelectedNodeRoot"
                   [layout$]="layout$" (saveNode)="onNodeSave($event)" (saveLayout)="onSaveLayout($event)"></app-options>
    </aside>
  </div>
</div>
