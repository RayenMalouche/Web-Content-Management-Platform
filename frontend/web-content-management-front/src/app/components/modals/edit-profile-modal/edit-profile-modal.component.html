<div class="kit-modal-backdrop" [style.display]="isVisible ? 'flex' : 'none'">
  <div class="kit-modal" role="dialog" aria-modal="true">
    <div class="kit-modal__head">
      <h3 class="kit-modal__title">Edit Profile</h3>
      <button type="button" class="kit-modal__close" aria-label="Close" (click)="onClose()">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>
    <div class="kit-modal__body">
      <form id="edit-profile-form">
        <div class="kit-field">
          <label for="profile-name">Full Name</label>
          <input type="text" id="profile-name" [(ngModel)]="profile.name" name="name" required>
        </div>
        <div class="kit-field">
          <label for="profile-email">Email</label>
          <input type="email" id="profile-email" [(ngModel)]="profile.email" name="email" required>
        </div>
        <div class="kit-field">
          <label for="profile-photo">Profile Photo</label>
          <input type="file" id="profile-photo">
        </div>
      </form>
    </div>
    <div class="kit-modal__foot">
      <button class="kit-btn" (click)="onClose()">Cancel</button>
      <button class="kit-btn kit-btn--primary" (click)="onSave()">Save Changes</button>
    </div>
  </div>
</div>
