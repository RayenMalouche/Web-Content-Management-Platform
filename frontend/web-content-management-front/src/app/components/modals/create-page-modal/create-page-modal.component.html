<div class="kit-modal-backdrop" [style.display]="isVisible ? 'flex' : 'none'">
  <div class="kit-modal" role="dialog" aria-modal="true">
    <div class="kit-modal__head">
      <h3 class="kit-modal__title">Créer une nouvelle page</h3>
      <button type="button" class="kit-modal__close" aria-label="Close" (click)="onClose()">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>
    <div class="kit-modal__body">
      <form [formGroup]="pageForm" (ngSubmit)="onSubmit()">
        <div class="kit-field">
          <label for="name">Nom de la page</label>
          <input type="text" id="name" formControlName="name" placeholder="Entrez le nom de la page">
        </div>

        <div class="kit-modal__foot">
          <button type="button" class="kit-btn" (click)="onClose()">Annuler</button>
          <button type="submit" class="kit-btn kit-btn--primary">Créer la page</button>
        </div>
      </form>
    </div>
  </div>
</div>
