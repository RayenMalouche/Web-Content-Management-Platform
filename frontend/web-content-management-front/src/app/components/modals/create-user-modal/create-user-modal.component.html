<div class="kit-modal-backdrop" [style.display]="isVisible ? 'flex' : 'none'">
  <div class="kit-modal" role="dialog" aria-modal="true">
    <div class="kit-modal__head">
      <h3 class="kit-modal__title">Create New User</h3>
      <button type="button" class="kit-modal__close" aria-label="Close" (click)="onClose()">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>
    <div class="kit-modal__body">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="kit-field">
          <label for="name">Name</label>
          <input type="text" id="name" formControlName="name" placeholder="Enter user name">
        </div>

        <div class="kit-field">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Enter user email">
        </div>

        <div class="kit-field">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Enter user password">
        </div>

        <div class="kit-field">
          <label for="role">Role</label>
          <select id="role" formControlName="role">
            <option value="admin">Admin</option>
            <option value="user">User</option>
          </select>
        </div>

        <div class="kit-modal__foot">
          <button type="button" class="kit-btn" (click)="onClose()">Cancel</button>
          <button type="submit" class="kit-btn kit-btn--primary">Create User</button>
        </div>
      </form>
    </div>
  </div>
</div>
