<div class="kit-modal__head">
  <h3 class="kit-modal__title">Modifier le site web</h3>
  <button type="button" class="kit-modal__close" aria-label="Close" (click)="close()">
    <fa-icon [icon]="faTimes"></fa-icon>
  </button>
</div>
<div class="kit-modal__body">
  <form [formGroup]="websiteForm" (ngSubmit)="saveChanges()">
    <div class="kit-field">
      <label for="name">Nom</label>
      <input type="text" id="name" formControlName="name" placeholder="Nom du site web">
    </div>

    <div class="kit-field">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" placeholder="Entrez une description"></textarea>
    </div>

    <div class="kit-field">
      <label for="domain">Domaine</label>
      <input type="text" id="domain" formControlName="domain" placeholder="example.com">
    </div>

    <div class="kit-field">
      <label for="primaryColor">Couleur principale</label>
      <input type="color" id="primaryColor" formControlName="primaryColor">
    </div>
  </form>
</div>
<div class="kit-modal__foot">
  <button type="button" class="kit-btn" (click)="close()">Annuler</button>
  <button type="submit" class="kit-btn kit-btn--primary" (click)="saveChanges()">Enregistrer</button>
</div>
