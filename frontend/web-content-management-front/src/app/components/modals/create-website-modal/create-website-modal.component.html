<div class="kit-modal-backdrop" [style.display]="isVisible ? 'flex' : 'none'">
  <div class="kit-modal" role="dialog" aria-modal="true">
    <div class="kit-modal__head">
      <h3 class="kit-modal__title">Create New Website</h3>
      <button type="button" class="kit-modal__close" aria-label="Close" (click)="onClose()">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>
    <div class="kit-modal__body">
      <form [formGroup]="websiteForm" (ngSubmit)="onSubmit()">
        <div class="kit-field">
          <label for="name">Website Name</label>
          <input type="text" id="name" formControlName="name" placeholder="My Website">
        </div>

        <div class="kit-field">
          <label for="domain">Domain Name</label>
          <input type="text" id="domain" formControlName="domain" placeholder="example.com">
        </div>

        <div class="kit-field">
          <label for="type">Website Type</label>
          <select id="type" formControlName="type">
            <option value="blank">Blank</option>
            <option value="blog">Blog</option>
            <option value="portfolio">Portfolio</option>
            <option value="ecommerce">E-Commerce</option>
          </select>
        </div>

        <div class="kit-field">
          <label for="primaryColor">Primary Color</label>
          <input type="color" id="primaryColor" formControlName="primaryColor">
        </div>

        <div class="kit-field">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" placeholder="Enter a description"></textarea>
        </div>

        <div class="kit-modal__foot">
          <button type="button" class="kit-btn" (click)="onClose()">Cancel</button>
          <button type="submit" class="kit-btn kit-btn--primary">Create Website</button>
        </div>
      </form>
    </div>
  </div>
</div>
