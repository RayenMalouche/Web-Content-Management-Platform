<div class="kit-grid" [style.--sprue-letter]="'&quot;' + sprue + '&quot;'">
  <ng-container *ngFor="let item of items">
    <ng-container *ngTemplateOutlet="cardTemplate; context: { $implicit: item }"></ng-container>
  </ng-container>
  <app-add-new-card [text]="addNewText" (add)="onAdd()"></app-add-new-card>
</div>
