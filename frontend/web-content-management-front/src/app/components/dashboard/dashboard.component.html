<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Instruction sheet</span>
        <h1>Dashboard</h1>
      </div>
      <button *ngIf="!isResponsable" type="button" (click)="openCreateWebsiteModal()" class="kit-btn kit-btn--primary">
        <fa-icon [icon]="faPlus"></fa-icon> New website
      </button>
    </header>

    <app-profile-section (editProfile)="openEditProfileModal()"></app-profile-section>

    <ng-container *ngIf="isResponsable">
      <h2 class="kit-step">
        <span class="kit-step__no">1</span> Users
        <button type="button" class="kit-btn kit-btn--sm kit-step__aside" (click)="viewAllUsers()">View all</button>
      </h2>
      <div class="kit-grid" style="--sprue-letter: 'U'">
        <app-user-card *ngFor="let user of (users$ | async)" [user]="user" (delete)="onUserDelete($event)"></app-user-card>
        <app-add-new-card text="Add a user" (add)="openCreateUserModal()"></app-add-new-card>
      </div>
    </ng-container>

    <h2 class="kit-step">
      <span class="kit-step__no">{{ isResponsable ? 2 : 1 }}</span> Projects
      <button type="button" class="kit-btn kit-btn--sm kit-step__aside" (click)="viewAllProjects()">View all</button>
    </h2>
    <div class="kit-grid" style="--sprue-letter: 'P'">
      <app-project-card *ngFor="let project of (projects$ | async)?.slice(0, 2)" [project]="project" (delete)="onProjectDelete($event)" (edit)="openEditProjectModal($event)"></app-project-card>
      <app-add-new-card text="Add a project" (add)="openCreateProjectModal()"></app-add-new-card>
    </div>

    <h2 class="kit-step">
      <span class="kit-step__no">{{ isResponsable ? 3 : 2 }}</span> Databases
      <button type="button" class="kit-btn kit-btn--sm kit-step__aside" (click)="viewAllDatabases()">View all</button>
    </h2>
    <div class="kit-grid" style="--sprue-letter: 'D'">
      <app-database-card *ngFor="let database of (databases$ | async)?.slice(0, 2)" [database]="database"></app-database-card>
      <app-add-new-card text="Add a database" (add)="openCreateDatabaseModal()"></app-add-new-card>
    </div>
  </main>
</div>

<app-create-website-modal #createWebsiteModal
                          (close)="onCreateWebsiteModalClose()"
                          (create)="onWebsiteCreate($event)">
</app-create-website-modal>

<app-edit-profile-modal #editProfileModal
                        (close)="onEditProfileModalClose()"
                        (save)="onProfileSave($event)">
</app-edit-profile-modal>

<app-create-database-modal #createDatabaseModal
                           (close)="onCreateDatabaseModalClose()"
                           (create)="onDatabaseCreate($event)">
</app-create-database-modal>

<app-create-project-modal #createProjectModal
                          (close)="onCreateProjectModalClose()"
                          (create)="onProjectCreate($event)">
</app-create-project-modal>

<app-create-user-modal #createUserModal
                       (close)="onCreateUserModalClose()"
                       (create)="onUserCreate($event)">
</app-create-user-modal>
