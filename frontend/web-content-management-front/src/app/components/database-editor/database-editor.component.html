<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Parts bin · database</span>
        <h1>Database</h1>
      </div>
    </header>

    <ng-container *ngIf="databaseId; else noDatabase">
      <!-- Only what the page actually knows: the old card showed made-up type, size and host. -->
      <section class="bin" aria-label="Database summary">
        <div>
          <span class="kit-eyebrow">Database ID</span>
          <p class="bin__id">{{ databaseId }}</p>
        </div>
        <div>
          <span class="kit-eyebrow">Tables</span>
          <p class="bin__count">{{ tables.length }}</p>
        </div>
      </section>

      <h2 class="kit-step"><span class="kit-step__no">1</span> Add a table</h2>
      <app-add-table (onAdd)="addTable($event)"></app-add-table>

      <h2 class="kit-step"><span class="kit-step__no">2</span> Tables</h2>
      <app-table-list [tables]="tables" (onEdit)="editTable($event)" (onDelete)="deleteTable($event)"></app-table-list>
    </ng-container>

    <ng-template #noDatabase>
      <div class="kit-empty">
        <p><strong>No database picked.</strong></p>
        <p>Open one from the dashboard with <em>Configure</em> to manage its tables.</p>
        <p style="margin-top: 1rem"><a routerLink="/dashboard" class="kit-btn kit-btn--sm">Back to the dashboard</a></p>
      </div>
    </ng-template>
  </main>
</div>
