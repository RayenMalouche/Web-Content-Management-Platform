<form (ngSubmit)="addTable()" class="add-table">
  <div class="kit-field add-table__field">
    <label for="tableName">Table name</label>
    <input id="tableName" [(ngModel)]="newTable.name" name="tableName" required placeholder="customers">
  </div>
  <button type="submit" class="kit-btn kit-btn--primary">Add table</button>
</form>
