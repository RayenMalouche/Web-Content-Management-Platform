<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Assembly · website pages</span>
        <h1>Pages</h1>
      </div>
      <button type="button" (click)="openAddPageModal()" class="kit-btn kit-btn--primary">
        <fa-icon [icon]="faPlus"></fa-icon> Add page
      </button>
    </header>

    <h2 class="kit-step"><span class="kit-step__no">1</span> Pick a page to build</h2>
    <div class="kit-grid" style="--sprue-letter: 'G'">
      <app-page-card *ngFor="let page of pages" [page]="page" (delete)="deletePage($event)" (edit)="editPage($event)"></app-page-card>
    </div>
    <p class="kit-empty" *ngIf="pages.length === 0">No pages yet. Add the first one and it opens in the builder.</p>
  </main>

  <app-create-page-modal #createPageModal
                         (close)="onCreatePageModalClose()"
                         (create)="onPageCreate($event)">
  </app-create-page-modal>
</div>
