<main class="setup">
  <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="kit-modal setup__card">
    <div class="kit-modal__head">
      <h3>New website</h3>
      <span class="kit-eyebrow" style="margin: 0">Step 1 of 1</span>
    </div>
    <div class="kit-modal__body">
      <div class="kit-field">
        <label for="name">Website name</label>
        <input id="name" formControlName="name" placeholder="My Website" />
      </div>
      <div class="kit-field">
        <label for="domain">Domain</label>
        <input id="domain" formControlName="domain" placeholder="example.com" />
      </div>
      <div class="kit-field">
        <label for="type">Type</label>
        <select id="type" formControlName="type">
          <option value="blog">Blog</option>
          <option value="portfolio">Portfolio</option>
          <option value="ecommerce">E-commerce</option>
        </select>
      </div>
      <div class="kit-field">
        <label for="primaryColor">Primary colour</label>
        <input id="primaryColor" type="color" formControlName="primaryColor" />
      </div>
      <div class="kit-field">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" placeholder="What the site is for"></textarea>
      </div>
      <button type="submit" class="kit-btn kit-btn--primary kit-btn--block">Create website</button>
    </div>
  </form>
</main>
