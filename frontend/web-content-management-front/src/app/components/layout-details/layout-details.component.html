<form [formGroup]="form" *ngIf="layout$ | async as layout" (ngSubmit)="onSave()">
  <fieldset class="spec__group">
    <legend><span class="spec__no">1</span> Layout</legend>
    <div class="kit-field">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Home page" formControlName="name">
      <span class="kit-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Name is required.</span>
    </div>
    <div class="kit-field">
      <label for="code">Code</label>
      <input type="text" id="code" placeholder="HOME" formControlName="code">
      <span class="kit-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">Code is required.</span>
    </div>
    <div class="kit-field">
      <label for="layout-description">Description</label>
      <input type="text" id="layout-description" placeholder="Optional" formControlName="description">
    </div>
    <div class="spec__pair">
      <div class="kit-field">
        <label for="type">Type</label>
        <select id="type" formControlName="type">
          <option value="SECTION">Section</option>
          <option value="ROUTABLE">Routable</option>
        </select>
      </div>
      <div class="kit-field">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
    </div>
  </fieldset>

  <fieldset class="spec__group">
    <legend><span class="spec__no">2</span> Size</legend>
    <div class="spec__pair">
      <div class="kit-field">
        <label for="layout-width">Width (px)</label>
        <input type="text" id="layout-width" placeholder="auto" formControlName="width">
      </div>
      <div class="kit-field">
        <label for="layout-height">Height (px)</label>
        <input type="text" id="layout-height" placeholder="auto" formControlName="height">
      </div>
    </div>
  </fieldset>

  <fieldset class="spec__group">
    <legend><span class="spec__no">3</span> Paint</legend>
    <div class="spec__pair">
      <div class="kit-field">
        <label for="layout-bg">Background</label>
        <input type="color" id="layout-bg" formControlName="backgroundColor">
      </div>
      <div class="kit-field">
        <label for="layout-border">Border</label>
        <input type="color" id="layout-border" formControlName="borderColor">
      </div>
    </div>
  </fieldset>

  <button type="submit" class="kit-btn kit-btn--primary kit-btn--block" [disabled]="form.invalid">Save layout</button>
</form>
