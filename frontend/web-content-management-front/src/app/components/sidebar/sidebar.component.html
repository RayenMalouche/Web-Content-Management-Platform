<!-- The side of the kit box: the kit's name, and the parts inventory as navigation. -->
<aside class="box">
  <div class="box__art">
    <span class="box__kit">Kit Nº 01 · 1:1 scale</span>
    <span class="box__name">Web App<br>Builder</span>
  </div>

  <nav class="box__menu" aria-label="Main">
    <p class="box__label">Contents</p>
    <button
      *ngFor="let item of menu; let i = index"
      type="button"
      class="box__item"
      [class.is-active]="activeMenuItem === item.id"
      [attr.aria-current]="activeMenuItem === item.id ? 'page' : null"
      (click)="setActiveMenuItem(item.id)"
    >
      <span class="box__no">{{ item.letter }}</span>
      <fa-icon [icon]="item.icon"></fa-icon>
      <span>{{ item.label }}</span>
    </button>
  </nav>

  <div class="box__user">
    <div class="box__avatar"><fa-icon [icon]="faUser"></fa-icon></div>
    <div class="box__who">
      <div class="box__user-name">{{ userName }}</div>
      <div class="box__user-role">{{ userRole }}</div>
    </div>
    <button type="button" class="box__logout" (click)="onLogout()" title="Log out" aria-label="Log out">
      <fa-icon [icon]="faSignOutAlt"></fa-icon>
    </button>
  </div>
</aside>
