<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Parts list · U</span>
        <h1>Users</h1>
      </div>
      <button type="button" (click)="openCreateUserModal()" class="kit-btn kit-btn--primary">
        <fa-icon [icon]="faPlus"></fa-icon> New user
      </button>
    </header>

    <div class="kit-search">
      <fa-icon [icon]="faSearch"></fa-icon>
      <label class="sr-only" for="search">Search users…</label>
      <input id="search" type="search" placeholder="Search users…" [(ngModel)]="searchTerm" (ngModelChange)="filterUsers()" />
    </div>

    <app-generic-list
      [items]="filteredUsers"
      [cardTemplate]="userCardTemplate"
      addNewText="Add a user"
      sprue="U"
      (add)="openCreateUserModal()">
    </app-generic-list>

    <ng-template #userCardTemplate let-item>
      <app-user-card [user]="item" (delete)="onUserDelete($event)"></app-user-card>
    </ng-template>
  </main>
</div>

<app-create-user-modal
  #createUserModal
  (close)="onCreateUserModalClose()"
  (create)="onUserCreate($event)">
</app-create-user-modal>
