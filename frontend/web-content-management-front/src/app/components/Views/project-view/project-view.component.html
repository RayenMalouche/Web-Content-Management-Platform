<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Parts list · P</span>
        <h1>Projects</h1>
      </div>
      <button type="button" (click)="openCreateProjectModal()" class="kit-btn kit-btn--primary">
        <fa-icon [icon]="faPlus"></fa-icon> New project
      </button>
    </header>

    <div class="kit-search">
      <fa-icon [icon]="faSearch"></fa-icon>
      <label class="sr-only" for="search">Search projects…</label>
      <input id="search" type="search" placeholder="Search projects…" [(ngModel)]="searchTerm" (ngModelChange)="filterProjects()" />
    </div>

    <app-generic-list
      [items]="filteredProjects"
      [cardTemplate]="projectCardTemplate"
      addNewText="Add a project"
      sprue="P"
      (add)="openCreateProjectModal()">
    </app-generic-list>

    <ng-template #projectCardTemplate let-item>
      <app-project-card [project]="item" (delete)="onProjectDelete($event)"></app-project-card>
    </ng-template>
  </main>
</div>

<app-create-project-modal
  #createProjectModal
  (close)="onCreateProjectModalClose()"
  (create)="onProjectCreate($event)">
</app-create-project-modal>
