<div class="kit-shell">
  <app-sidebar></app-sidebar>

  <main class="kit-main">
    <header class="kit-page-head">
      <div>
        <span class="kit-eyebrow">Parts list · W</span>
        <h1>Websites</h1>
      </div>
      <button type="button" (click)="openCreateWebsiteModal()" class="kit-btn kit-btn--primary">
        <fa-icon [icon]="faPlus"></fa-icon> New website
      </button>
    </header>

    <div class="kit-search">
      <fa-icon [icon]="faSearch"></fa-icon>
      <label class="sr-only" for="search">Search websites…</label>
      <input id="search" type="search" placeholder="Search websites…" [(ngModel)]="searchTerm" (ngModelChange)="filterWebsites()" />
    </div>

    <app-generic-list
      [items]="filteredWebsites"
      [cardTemplate]="websiteCardTemplate"
      addNewText="Add a website"
      sprue="W"
      (add)="openCreateWebsiteModal()">
    </app-generic-list>

    <ng-template #websiteCardTemplate let-item>
      <app-website-card [website]="item" (delete)="onWebsiteDelete($event)" (edit)="openEditWebsiteModal($event)"></app-website-card>
    </ng-template>
  </main>
</div>

<app-create-website-modal
  #createWebsiteModal
  (close)="onCreateWebsiteModalClose()"
  (create)="onWebsiteCreate($event)">
</app-create-website-modal>
