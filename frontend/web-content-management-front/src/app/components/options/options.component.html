<!-- The paint guide: the selected part's spec, or the layout's. -->
<div class="guide">
  <div class="guide__tabs" role="tablist" aria-label="Paint guide">
    <button type="button" role="tab" id="tab-node" aria-controls="panel-node"
            [attr.aria-selected]="activeTab === 'node'" [class.is-active]="activeTab === 'node'"
            (click)="activeTab = 'node'">Selected part</button>
    <button type="button" role="tab" id="tab-layout" aria-controls="panel-layout"
            [attr.aria-selected]="activeTab === 'layout'" [class.is-active]="activeTab === 'layout'"
            (click)="activeTab = 'layout'">Layout</button>
  </div>

  <div role="tabpanel" id="panel-node" aria-labelledby="tab-node" [hidden]="activeTab !== 'node'">
    <app-node-details [selectedNode$]="selectedNode$" [selectedNodeIsRoot]="selectedNodeIsRoot" (save)="saveNode.emit($event)"></app-node-details>
  </div>
  <div role="tabpanel" id="panel-layout" aria-labelledby="tab-layout" [hidden]="activeTab !== 'layout'">
    <app-layout-details [layout$]="layout$" (save)="saveLayout.emit($event)"></app-layout-details>
  </div>
</div>
