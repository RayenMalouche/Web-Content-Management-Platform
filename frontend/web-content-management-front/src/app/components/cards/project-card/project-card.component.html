<article class="kit-part">
  <span class="kit-part__no" aria-hidden="true"></span>
  <span class="kit-eyebrow">Project</span>
  <h3 class="kit-part__title">{{ project.name }}</h3>
  <p class="kit-part__meta">{{ project.description }}</p>
  <div class="kit-part__actions">
    <a class="kit-btn kit-btn--sm kit-btn--primary" [routerLink]="['/project', project.id]">
      <fa-icon [icon]="faEye"></fa-icon> Open
    </a>
    <button type="button" class="kit-btn kit-btn--sm" (click)="onEdit()">
      <fa-icon [icon]="faEdit"></fa-icon> Edit
    </button>
    <button type="button" class="kit-btn kit-btn--sm kit-btn--danger" (click)="onDelete()">
      <fa-icon [icon]="faTrash"></fa-icon>
      <span class="sr-only">Delete</span>
    </button>
  </div>
</article>
