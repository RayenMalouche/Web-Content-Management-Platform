<article class="kit-part">
  <span class="kit-part__no" aria-hidden="true"></span>
  <span class="kit-eyebrow"><fa-icon [icon]="website.type === 'laptop' ? faLaptop : faStore"></fa-icon> Website</span>
  <h3 class="kit-part__title">{{ website.name }}</h3>
  <p class="kit-part__meta">{{ website.description }}</p>
  <div class="kit-part__actions">
    <button type="button" class="kit-btn kit-btn--sm kit-btn--primary" (click)="onView()">
      <fa-icon [icon]="faEye"></fa-icon> Pages
    </button>
    <button type="button" class="kit-btn kit-btn--sm" (click)="onEdit()">
      <fa-icon [icon]="faEdit"></fa-icon> Edit
    </button>
    <button type="button" class="kit-btn kit-btn--sm kit-btn--danger" (click)="onDelete()">
      <fa-icon [icon]="faTrash"></fa-icon>
      <span class="sr-only">Delete</span>
    </button>
  </div>
</article>
