<article class="kit-part">
  <span class="kit-part__no" aria-hidden="true"></span>
  <span class="kit-eyebrow">Page</span>
  <h3 class="kit-part__title">{{ page.name }}</h3>
  <div class="kit-part__actions">
    <button type="button" class="kit-btn kit-btn--sm kit-btn--primary" (click)="onEdit()">
      <fa-icon [icon]="faEdit"></fa-icon> Build
    </button>
    <button type="button" class="kit-btn kit-btn--sm kit-btn--danger" (click)="onDelete()">
      <fa-icon [icon]="faTrash"></fa-icon> Delete
    </button>
  </div>
</article>
