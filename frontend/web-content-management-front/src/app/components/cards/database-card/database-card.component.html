<article class="kit-part">
  <span class="kit-part__no" aria-hidden="true"></span>
  <span class="kit-eyebrow"><fa-icon [icon]="faDatabase"></fa-icon> Database</span>
  <h3 class="kit-part__title">{{ database.name }}</h3>
  <div class="kit-part__actions">
    <button type="button" class="kit-btn kit-btn--sm kit-btn--primary" (click)="configureDatabase()">
      <fa-icon [icon]="faEdit"></fa-icon> Configure
    </button>
  </div>
</article>
